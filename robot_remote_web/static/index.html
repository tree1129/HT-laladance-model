<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HT Pi Plus 网页遥控器</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">HT Pi Plus Remote</p>
          <h1>网页遥控器</h1>
          <p class="subtitle">用于三天啦啦操 Demo 的安全控制台。先确认急停可用，再测试唤醒、低速移动、动作触发和安全编排。</p>
        </div>
        <div class="status-card">
          <div class="status-line"><span>机器人</span><strong id="robot-host">-</strong></div>
          <div class="status-line"><span>用户</span><strong id="robot-user">-</strong></div>
          <div class="status-line"><span>状态</span><strong id="status-text">就绪</strong></div>
          <div class="status-line"><span>控制链路</span><strong id="bridge-status">Joy 模式</strong></div>
          <div class="hero-actions">
            <button id="cheer-btn" class="hero-btn accent">双手欢呼</button>
            <button id="choreo-btn" class="hero-btn">安全啦啦操编排</button>
          </div>
        </div>
      </section>

      <section class="panel-grid">
        <section class="panel">
          <div class="panel-head">
            <h2>方向控制</h2>
            <div class="quick-actions">
              <button id="wake-btn" class="ghost">唤醒运动模式</button>
              <button id="stop-btn" class="ghost danger">急停</button>
            </div>
          </div>
          <div class="keyboard-hint">
            <span><code>W/A/S/D</code> 前后左右</span>
            <span><code>Q/E</code> 转向</span>
            <span><code>R</code> 安全原地踏步</span>
            <span><code>Space</code> 急停</span>
            <span><code>C</code> 双手欢呼</span>
          </div>
          <div class="drive-pad">
            <button data-move="forward" class="pad-btn">低速前进</button>
            <button data-move="left" class="pad-btn">低速左移</button>
            <button data-move="stop" class="pad-btn center">停止</button>
            <button data-move="right" class="pad-btn">低速右移</button>
            <button data-move="backward" class="pad-btn">低速后退</button>
            <button data-move="turn-left" class="pad-btn slim">低速左转</button>
            <button data-move="turn-right" class="pad-btn slim">低速右转</button>
            <button data-move="march-toggle" id="march-btn" class="pad-btn accent wide">安全原地踏步</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>动作库</h2>
            <span class="badge" id="action-count">0</span>
          </div>
          <div class="library-block">
            <h3>策略动作</h3>
            <div id="policy-list" class="action-list"></div>
          </div>
          <div class="library-block">
            <h3>单段动作</h3>
            <div id="waypoint-list" class="action-list"></div>
          </div>
          <div class="library-block">
            <h3>串联动作</h3>
            <div id="series-list" class="action-list"></div>
          </div>
        </section>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">
          <h2>执行日志</h2>
        </div>
        <pre id="log-output"></pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
